name: Correction Intelligente et Génération de Rapport Propre

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ai-check-and-clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v3

    - name: Installer Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Exécuter le script de correction et de vérification
      run: |
        python verify_calculs.py

    - name: Sauvegarder automatiquement le rapport corrigé dans GitHub
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "Intelligence Bot : Correction automatique des fautes et validation des calculs 100%"
        file_pattern: rapport_nettoye.md
